<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Fire and Fellowship — Household &amp; Headship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17140F; --panel: #211C15; --brass: #B08D4F; --brass-bright: #D9B876;
    --cream: #EDE4D3; --muted: #9C9182; --rule: #3A3226; --shadow: rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(1200px 700px at 50% -10%, #221D15 0%, var(--bg) 55%), var(--bg);
    color: var(--cream); font-family:'IBM Plex Sans', sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    min-height:100vh; padding: 32px 16px 60px;
  }
  .stage{ width:100%; max-width: 680px; }
  .eyebrow{ text-align:center; letter-spacing:.22em; text-transform:uppercase; font-size:11px; color: var(--brass); margin-bottom: 10px; font-weight:600; }
  h1{ text-align:center; font-family:'Fraunces', serif; font-weight:500; font-size: clamp(28px, 5vw, 40px); margin: 0 0 6px; color: var(--cream); }
  .sub{ text-align:center; color: var(--muted); font-size: 14px; margin-bottom: 22px; }

  .lang-switch{ display:flex; justify-content:center; gap: 6px; margin-bottom: 18px; }
  .lang-btn{
    appearance:none; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; font-weight:600;
    font-size: 11.5px; letter-spacing:.06em; color: var(--muted); background: transparent;
    border: 1px solid var(--rule); padding: 6px 12px; border-radius: 999px; transition: all .15s ease;
  }
  .lang-btn.active{ color: var(--bg); background: var(--brass); border-color: var(--brass); }
  .lang-btn:hover{ color: var(--cream); border-color: var(--brass); }

  .mode-switch{ display:flex; justify-content:center; gap: 8px; margin-bottom: 26px; }
  .mode-btn{
    appearance:none; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; font-size: 12.5px;
    letter-spacing:.04em; color: var(--muted); background: transparent; border: 1px solid var(--rule);
    padding: 8px 16px; border-radius: 999px; transition: all .15s ease;
  }
  .mode-btn.active{ color: var(--bg); background: var(--brass-bright); border-color: var(--brass-bright); font-weight:600; }
  .mode-btn:hover{ color: var(--cream); border-color: var(--brass); }

  .book{
    position:relative; background: linear-gradient(180deg, var(--panel) 0%, #1D1811 100%);
    border: 1px solid var(--rule); border-radius: 6px;
    box-shadow: 0 30px 60px -25px var(--shadow), inset 0 1px 0 rgba(255,255,255,.03);
    padding: 44px 40px 36px; overflow: hidden;
  }
  .book::before{ content:""; position:absolute; left:0; top:0; bottom:0; width: 6px; background: linear-gradient(180deg, var(--brass), #7A5E30); opacity:.55; }
  .ribbon{
    position:absolute; top:0; right: 46px; width: 22px; height: 64px;
    background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%);
    box-shadow: 0 6px 14px -6px var(--shadow);
  }
  .tag{
    display:inline-block; font-size: 11px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--bg); background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    padding: 5px 11px; border-radius: 3px; font-weight:600; margin-bottom: 22px;
  }
  .verse-text{
    font-family:'Fraunces', serif; font-weight: 400; font-size: clamp(20px, 3.4vw, 26px);
    line-height: 1.5; color: var(--cream); margin: 0 0 22px; min-height: 150px;
    transition: opacity .3s ease, transform .3s ease;
  }
  .verse-text::before{ content:"\201C"; color: var(--brass); }
  .verse-text::after{ content:"\201D"; color: var(--brass); }
  .ref-row{ display:flex; align-items:center; gap: 14px; margin-bottom: 22px; transition: opacity .3s ease; }
  .ref-line{ flex:1; height:1px; background: var(--rule); }
  .ref{ font-family:'Fraunces', serif; font-weight:600; font-style:italic; color: var(--brass-bright); font-size: 15px; white-space: nowrap; }

  .question{
    font-size: 14.5px; line-height:1.6; color: var(--muted); background: rgba(176,141,79,.08);
    border-left: 2px solid var(--brass); padding: 12px 16px; border-radius: 2px; margin-bottom: 28px; transition: opacity .3s ease;
  }
  .question b{ color: var(--brass-bright); font-weight:600; }
  .fade{ opacity: 0; transform: translateY(6px); }

  .actions{ display:flex; align-items:center; justify-content:space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 24px; }
  .draw-btn{
    appearance:none; border:none; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; font-weight:600;
    font-size: 14px; letter-spacing:.03em; color: #1B160E; background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    padding: 13px 26px; border-radius: 4px; box-shadow: 0 8px 18px -8px rgba(176,141,79,.6), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .draw-btn:hover{ transform: translateY(-1px); }
  .draw-btn:active{ transform: translateY(1px) scale(.99); }
  .draw-btn:focus-visible{ outline: 2px solid var(--brass-bright); outline-offset: 3px; }
  .count{ font-size: 12px; color: var(--muted); letter-spacing:.05em; }

  .filters{ display:flex; flex-wrap:wrap; gap: 8px; justify-content:center; margin-top: 22px; }
  .filter-btn{
    appearance:none; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; font-size: 12px;
    letter-spacing:.03em; color: var(--muted); background: transparent; border: 1px solid var(--rule);
    padding: 7px 13px; border-radius: 999px; transition: all .15s ease;
  }
  .filter-btn:hover{ color: var(--cream); border-color: var(--brass); }
  .filter-btn.active{ color: var(--bg); background: var(--brass-bright); border-color: var(--brass-bright); font-weight:600; }

  .footer-note{ text-align:center; font-size: 12px; color: var(--muted); margin-top: 22px; }

  .handout{ display:none; }
  .handout.visible{ display:block; }
  .handout-head{ display:flex; justify-content:space-between; align-items:center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .handout-head h2{ font-family:'Fraunces', serif; font-weight:500; font-size: 20px; margin:0; color: var(--cream); }
  .print-btn{
    appearance:none; cursor:pointer; border: 1px solid var(--brass); background: transparent; color: var(--brass-bright);
    font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size: 13px; padding: 9px 18px; border-radius: 4px; transition: all .15s ease;
  }
  .print-btn:hover{ background: var(--brass); color: var(--bg); }

  .cat-block{ margin-bottom: 30px; }
  .cat-title{ font-size: 11px; letter-spacing:.18em; text-transform:uppercase; color: var(--brass); font-weight:600; margin-bottom: 12px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
  .entry{ background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; padding: 18px 20px; margin-bottom: 12px; }
  .entry-ref{ font-family:'Fraunces', serif; font-weight:600; font-style:italic; color: var(--brass-bright); font-size: 14px; margin-bottom: 6px; }
  .entry-text{ font-family:'Fraunces', serif; font-size: 16px; line-height:1.55; color: var(--cream); margin-bottom: 10px; }
  .entry-q{ font-size: 13px; color: var(--muted); line-height:1.5; }
  .entry-q b{ color: var(--brass-bright); }

  @media print{
    body{ background: #fff !important; color:#111 !important; padding: 0; display:block; }
    .stage{ max-width: 100%; }
    .eyebrow, .mode-switch, .lang-switch, .filters, .footer-note, .print-btn, .book{ display:none !important; }
    .handout{ display:block !important; }
    h1{ color:#111; font-size: 24px; margin-top: 0; }
    .sub{ color:#444; margin-bottom: 20px; }
    .handout-head{ margin-bottom: 14px; }
    .cat-title{ color:#333; border-color:#ccc; }
    .entry{ background:#fff; border:1px solid #ccc; break-inside: avoid; padding: 12px 14px; margin-bottom: 8px; }
    .entry-ref, .entry-q b{ color:#333; }
    .entry-text{ color:#111; font-size: 14px; }
    .entry-q{ color:#555; font-size: 12px; }
    .cat-block{ margin-bottom: 16px; }
  }
  @media (prefers-reduced-motion: reduce){ .verse-text, .ref-row, .draw-btn{ transition: none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="eyebrow">Fire and Fellowship</div>
  <h1 id="h1Text">Household &amp; Headship</h1>
  <div class="sub" id="subText">Verses and prayers on a man's calling to lead, love, provide, and father well.</div>

  <div class="lang-switch" id="langSwitch"></div>

  <div class="mode-switch">
    <button class="mode-btn active" id="drawModeBtn"></button>

  <div id="drawMode">
    <div class="book">

      <p class="verse-text" id="verseText">Loading…</p>
      <div class="ref-row">
        <span class="ref" id="ref"></span>
        <span class="ref-line"></span>
      </div>
      <div class="question" id="question"><b id="questionLabel">Discuss:</b> <span id="questionText"></span></div>
      <div class="actions">
        <button class="draw-btn" id="drawBtn"></button>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="footer-note" id="footerNote1"></div>
  </div>

  <div id="handoutView" class="handout">
    <div class="handout-head">
      <h2 id="handoutTitle">Fire and Fellowship — Full Handout</h2>
      <button class="print-btn" id="printBtn"></button>
    </div>
    <div id="handoutBody"></div>
    <div class="footer-note" id="footerNote2" style="margin-top:4px;"></div>
  </div>
</div>
